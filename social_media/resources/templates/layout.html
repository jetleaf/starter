<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{description}}">
  <title>{{title}} · SocialPulse</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f8fafc; color: #111827; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 1.25rem; }
    .site-header { background: #0f172a; color: #e5e7eb; padding: .75rem 0; }
    .site-header .wrap { display: flex; justify-content: space-between; align-items: center; }
    .brand { color: #34d399; font-weight: 800; text-decoration: none; font-size: 1.15rem; }
    .site-header nav a { color: #cbd5e1; margin-left: 1.1rem; text-decoration: none; }
    main.wrap { padding: 1.5rem 1.25rem 3rem; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: .6rem; padding: 1rem 1.25rem; margin-bottom: .75rem; }
    .post { border-left: 4px solid #34d399; }
    .meta { color: #64748b; font-size: .85rem; margin-top: .4rem; }
    .tag { background: #ecfdf5; color: #065f46; border-radius: 9999px; padding: .1rem .55rem; font-size: .75rem; margin-right: .3rem; }
    .stat { display: inline-block; margin-right: 1.1rem; font-weight: 600; color: #0f172a; }
    footer { border-top: 1px solid #e2e8f0; padding: 1rem 0; color: #64748b; font-size: .85rem; }
  </style>
</head>
<body data-theme="{{theme}}">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/portal">SocialPulse</a>
      <nav>
        <a href="/portal">Trending</a>
        <a href="/api/feed/global">API Feed</a>
        <a href="/actuator/info">Info</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
{{content}}
  </main>
  <footer class="wrap">
    <p>SocialPulse — server-rendered with JTL. © {{year}} Hapnium.</p>
  </footer>
</body>
</html>
