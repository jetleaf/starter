name: fullstack_sync_backend
description: Notes sync API built with Jetleaf — pairs with the Flutter client in ../flutter_app and the shared contracts in ../shared.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.9.0

dependencies:
  jetleaf: ^2.1.0
  jetleaf_web: ^2.1.0
  jetson: ^2.1.0
  jetleaf_core: ^2.1.0
  fullstack_sync_shared:
    path: ../shared

dev_dependencies:
  test: ^1.31.1
  lints: ^6.1.0
