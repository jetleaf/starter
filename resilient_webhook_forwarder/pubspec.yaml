name: resilient_webhook_forwarder
description: High-reliability webhook dispatcher with declarative retries, exponential backoff, dead-letter queue, and in-memory idempotency. Built with Jetleaf.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.9.0

dependencies:
  jetleaf: ^2.1.0
  jetleaf_web: ^2.1.0
  jetleaf_retry: ^2.1.0
  jetleaf_validation: ^2.1.0
  jetson: ^2.1.0

dev_dependencies:
  test: ^1.31.1
  lints: ^6.1.0
  jetleaf_core: ^2.1.0
