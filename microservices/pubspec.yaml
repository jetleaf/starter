name: microservices
description: "Jetleaf microservices reference - API gateway + user, order and notification services with retry, fallback, health aggregation and per-service profiles, built on Jetleaf 2.1."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.9.0

workspace:
  - common
  - gateway
  - user_service
  - order_service
  - notification_service

dependency_overrides:
  jetleaf:
    path: ../../jetleaf
  jetleaf_core:
    path: ../../jetleaf/libraries/jetleaf_core
  jetleaf_tools:
    path: ../../jetleaf/libraries/jetleaf_tools
  jetleaf_web:
    path: ../../jetleaf/packages/jetleaf_web
  jetleaf_validation:
    path: ../../jetleaf/packages/jetleaf_validation
  jetleaf_retry:
    path: ../../jetleaf/packages/jetleaf_retry
  jetleaf_scheduling:
    path: ../../jetleaf/packages/jetleaf_scheduling
  jetleaf_actuator:
    path: ../../jetleaf/packages/jetleaf_actuator
  jetleaf_resource:
    path: ../../jetleaf/packages/jetleaf_resource
  jetson:
    path: ../../jetleaf/packages/jetson
  jtl:
    path: ../../jetleaf/packages/jtl
